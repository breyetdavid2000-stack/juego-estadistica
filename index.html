<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estadística en un Vistazo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0fdf4; /* bg-green-50 */
            touch-action: manipulation;
        }

        /* Animaciones personalizadas */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.2s ease-out;
        }

        .box-correct {
            background-color: #22c55e; /* green-500 */
            color: white;
            border-color: #16a34a; /* green-600 */
        }

        .box-wrong {
            background-color: #ef4444 !important; /* red-500 */
            color: white !important;
            border-color: #dc2626 !important; /* red-600 */
            transition: background-color 0.2s;
        }

        .box-active {
            border-color: #eab308; /* yellow-500 */
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        
        /* Teclado virtual */
        .key {
            transition: all 0.1s;
        }
        .key:active {
            transform: scale(0.95);
            background-color: #d1d5db;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <!-- BARRA SUPERIOR (Visible durante el juego) -->
    <header id="top-bar" class="hidden bg-green-600 text-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto flex justify-between items-center text-sm sm:text-base font-semibold">
            <div id="player-display" class="truncate max-w-[30%]">Jugador: ---</div>
            <div class="flex gap-4 sm:gap-8">
                <div>Tiempo: <span id="timer-display" class="font-mono text-yellow-300">00:00</span></div>
                <div>Puntos: <span id="score-display" class="text-yellow-300">0</span></div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
            
            <!-- PANTALLA DE INICIO -->
            <section id="start-screen" class="p-8 sm:p-12 text-center">
                <div class="mb-8">
                    <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    <h1 class="text-3xl sm:text-5xl font-bold text-green-700 mb-2">Estadística en un Vistazo</h1>
                    <p class="text-gray-500 sm:text-lg">Demuestra tus conocimientos estadísticos letra por letra.</p>
                </div>
                
                <div class="max-w-md mx-auto space-y-6">
                    <div>
                        <label for="player-name" class="block text-left text-sm font-semibold text-gray-700 mb-1">Nombre del Jugador</label>
                        <input type="text" id="player-name" placeholder="Escribe tu nombre aquí..." class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all text-lg" autocomplete="off">
                    </div>
                    <button id="btn-start" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transform transition hover:-translate-y-1 text-lg">
                        ¡Comenzar Juego!
                    </button>
                </div>
            </section>

            <!-- PANTALLA DE JUEGO -->
            <section id="game-screen" class="hidden p-4 sm:p-8 flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-6">
                    <span id="question-counter" class="bg-green-100 text-green-800 px-4 py-1 rounded-full font-semibold text-sm">Pregunta 1 de 12</span>
                    <button id="btn-hint" class="flex items-center gap-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-4 py-2 rounded-lg font-bold shadow transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        Pista (<span id="hints-left">3</span>)
                    </button>
                </div>

                <div class="w-full text-center mb-8">
                    <h2 id="question-text" class="text-xl sm:text-2xl font-semibold text-gray-800 min-h-[4rem] flex items-center justify-center">
                        ¿Pregunta?
                    </h2>
                </div>

                <!-- Contenedor de Pistas Mostradas -->
                <div id="hints-container" class="w-full max-w-2xl mb-6 space-y-2 hidden">
                    <!-- Las pistas se inyectan aquí -->
                </div>

                <!-- Cajas de Letras -->
                <div id="word-container" class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-8">
                    <!-- Las cajas se inyectan aquí -->
                </div>

                <!-- Teclado Virtual -->
                <div id="virtual-keyboard" class="w-full max-w-2xl flex flex-col gap-2 mt-4 select-none">
                    <!-- Teclado se inyecta por JS -->
                </div>
            </section>

            <!-- PANTALLA DE EXPLICACIÓN (Entre preguntas) -->
            <section id="explanation-screen" class="hidden p-8 sm:p-12 text-center">
                <div id="result-icon" class="w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center">
                    <!-- Icono inyectado por JS (Check o X) -->
                </div>
                
                <h2 id="result-title" class="text-3xl font-bold mb-2">¡Correcto!</h2>
                <p id="points-awarded" class="text-lg font-semibold text-yellow-600 mb-6">+100 Puntos</p>
                
                <div class="bg-gray-50 border-l-4 border-green-500 p-6 rounded-r-xl mb-8 text-left shadow-sm">
                    <h3 class="text-sm text-green-600 font-bold uppercase tracking-wider mb-2">Explicación:</h3>
                    <p id="explanation-text" class="text-gray-700 text-lg sm:text-xl leading-relaxed">
                        Texto de explicación...
                    </p>
                </div>

                <button id="btn-next" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg transform transition hover:-translate-y-1 text-lg">
                    Siguiente Pregunta
                </button>
            </section>

            <!-- PANTALLA FINAL -->
            <section id="end-screen" class="hidden p-8 sm:p-12 text-center">
                <h1 class="text-4xl font-bold text-green-700 mb-4">¡Juego Terminado!</h1>
                <p id="final-message" class="text-xl text-gray-600 mb-8">¡Gran trabajo, [Nombre]!</p>
                
                <div class="bg-green-50 rounded-2xl p-8 mb-8 inline-block shadow-inner">
                    <div class="text-sm text-green-800 font-semibold uppercase tracking-wider mb-2">Puntaje Final</div>
                    <div id="final-score" class="text-6xl font-black text-green-600 mb-4">0</div>
                    
                    <!-- Estrellas -->
                    <div id="stars-container" class="flex justify-center gap-2 text-4xl text-gray-300">
                        <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                    </div>
                </div>

                <div>
                    <button id="btn-restart" class="w-full sm:w-auto bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-4 px-10 rounded-xl shadow-lg transform transition hover:-translate-y-1 text-lg">
                        Jugar de Nuevo
                    </button>
                </div>
            </section>

        </div>
    </main>

    <script>
        // --- BASE DE DATOS DE PREGUNTAS ---
        const questionsData = [
            {
                answer: "MEDIA",
                question: "¿Qué medida se obtiene sumando todos los datos y dividiendo entre la cantidad?",
                hints: [
                    "Se acompaña de la desviación típica",
                    "Es el punto central en un diagrama de cajas",
                    "Suma todos los datos y divide entre cuántos hay"
                ],
                explanation: "La MEDIA es la suma de todos los datos dividida entre la cantidad. Ej: (4+6+8)/3 = 6"
            },
            {
                answer: "MEDIANA",
                question: "¿Cuál es el valor que queda justo en el centro cuando los datos están ordenados?",
                hints: [
                    "Si hay cantidad par de datos, promedia los dos del centro",
                    "Se usa cuando hay datos extremos que distorsionan el promedio",
                    "En el conjunto 3,5,7,9,11 el valor central es 7"
                ],
                explanation: "La MEDIANA es el valor central de los datos ordenados de menor a mayor."
            },
            {
                answer: "MODA",
                question: "¿Cómo se llama el valor que más se repite en un conjunto de datos?",
                hints: [
                    "Un conjunto puede tener más de una",
                    "Si ningún dato se repite, no existe",
                    "En el conjunto 2,3,3,5,3 es el número 3"
                ],
                explanation: "La MODA es el dato que aparece con mayor frecuencia en el conjunto."
            },
            {
                answer: "RANGO",
                question: "¿Cómo se llama la diferencia entre el valor máximo y el mínimo de un conjunto?",
                hints: [
                    "Mide qué tan dispersos están los datos",
                    "En el conjunto 5,10,15,20,25 soy igual a 20",
                    "Es una resta simple: máximo menos mínimo"
                ],
                explanation: "El RANGO mide la dispersión. Rango = Valor máximo - Valor mínimo."
            },
            {
                answer: "DATOS",
                question: "¿Cómo se llaman los valores que se recolectan para estudiar un fenómeno estadístico?",
                hints: [
                    "Pueden ser cualitativos o cuantitativos",
                    "Sin ellos no hay estadística posible",
                    "Las notas de un salón de clase son un ejemplo"
                ],
                explanation: "Los DATOS son la materia prima de la estadística. Pueden ser palabras o números."
            },
            {
                answer: "MUESTRA",
                question: "¿Cómo se llama la parte representativa de la población usada en un estudio?",
                hints: [
                    "Es más pequeña que la población total",
                    "Los sondeos electorales la usan para predecir resultados",
                    "Encuestar 50 de 500 estudiantes es tomar una de ella"
                ],
                explanation: "La MUESTRA es un subconjunto representativo de la población total."
            },
            {
                answer: "FRECUENCIA",
                question: "¿Cómo se llama el número de veces que un dato aparece en un conjunto?",
                hints: [
                    "Puede ser absoluta o relativa",
                    "Las tablas de conteo la organizan visualmente",
                    "Si el dato 5 aparece 4 veces en la lista, soy 4"
                ],
                explanation: "La FRECUENCIA indica cuántas veces aparece un dato. Absoluta es conteo, relativa es porcentaje."
            },
            {
                answer: "HISTOGRAMA",
                question: "¿Qué gráfico tiene barras pegadas entre sí y representa datos agrupados en intervalos?",
                hints: [
                    "Sus barras no tienen espacio entre ellas",
                    "Se usa para representar edades o temperaturas",
                    "Sus barras representan intervalos, no valores individuales"
                ],
                explanation: "El HISTOGRAMA representa datos continuos agrupados en intervalos. Sus barras son contiguas."
            },
            {
                answer: "GRAFICO",
                question: "¿Cómo se llama la representación visual de datos que puede ser de barras, circular o lineal?",
                hints: [
                    "Se usa para comunicar información rápidamente",
                    "Los noticieros lo usan para mostrar estadísticas",
                    "La torta y el diagrama de barras son tipos de él"
                ],
                explanation: "Un GRÁFICO estadístico representa datos visualmente para facilitar su interpretación."
            },
            {
                answer: "POBLACION",
                question: "En estadística, ¿cómo se llama el conjunto TOTAL de individuos que se quieren estudiar?",
                hints: [
                    "De ella se extrae la muestra",
                    "Todos los estudiantes de Colombia serían ella",
                    "Es el universo completo del estudio estadístico"
                ],
                explanation: "La POBLACIÓN es el conjunto completo de individuos del estudio estadístico."
            },
            {
                answer: "VARIABLE",
                question: "¿Cómo se llama la característica que puede tomar diferentes valores en cada individuo?",
                hints: [
                    "Puede ser discreta o continua",
                    "La edad, el peso y la estatura son ejemplos",
                    "Cada pregunta de una encuesta corresponde a una de ellas"
                ],
                explanation: "Una VARIABLE es una característica medible que varía entre individuos."
            },
            {
                answer: "PORCENTAJE",
                question: "¿Cómo se llama la forma de expresar una cantidad como parte de 100?",
                hints: [
                    "El símbolo % la representa",
                    "Los gráficos circulares la usan mucho",
                    "Se calcula multiplicando la fracción por 100"
                ],
                explanation: "El PORCENTAJE expresa una proporción sobre 100. Es clave para leer gráficos circulares."
            }
        ];

        // --- ESTADO DEL JUEGO ---
        let gameState = {
            playerName: "",
            score: 0,
            currentQuestionIndex: 0,
            hintsUsed: 0,
            typedLetters: "",
            timerSeconds: 0,
            timerInterval: null,
            status: 'start' // start, playing, explanation, end
        };

        // --- ELEMENTOS DEL DOM ---
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            explanation: document.getElementById('explanation-screen'),
            end: document.getElementById('end-screen')
        };
        const topBar = document.getElementById('top-bar');
        
        // --- INICIALIZACIÓN Y EVENTOS ---
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-hint').addEventListener('click', useHint);
        document.getElementById('btn-next').addEventListener('click', nextQuestion);
        document.getElementById('btn-restart').addEventListener('click', resetGame);
        
        // Teclado físico
        window.addEventListener('keydown', (e) => {
            if (gameState.status !== 'playing') return;
            // Solo procesar si es una letra
            if (/^[a-zA-ZñÑ]$/.test(e.key)) {
                handleLetterInput(e.key.toUpperCase());
            }
        });

        // Crear teclado virtual
        const keyboardLayout = [
            "Q W E R T Y U I O P",
            "A S D F G H J K L Ñ",
            "Z X C V B N M"
        ];
        
        function renderVirtualKeyboard() {
            const container = document.getElementById('virtual-keyboard');
            container.innerHTML = '';
            
            keyboardLayout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex justify-center gap-1 sm:gap-2';
                const keys = row.split(' ');
                
                keys.forEach(key => {
                    const btn = document.createElement('button');
                    btn.textContent = key;
                    btn.className = 'key bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-2 sm:px-4 rounded-lg shadow-sm text-sm sm:text-lg flex-1 max-w-[3rem] sm:max-w-[4rem]';
                    btn.addEventListener('click', () => {
                        if (gameState.status === 'playing') {
                            handleLetterInput(key);
                        }
                    });
                    rowDiv.appendChild(btn);
                });
                container.appendChild(rowDiv);
            });
        }

        // --- FUNCIONES CORE ---

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
            
            if (screenName === 'start') {
                topBar.classList.add('hidden');
            } else {
                topBar.classList.remove('hidden');
            }
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) {
                alert("Por favor, ingresa tu nombre para comenzar.");
                return;
            }
            
            gameState.playerName = nameInput;
            document.getElementById('player-display').textContent = `Jugador: ${nameInput}`;
            
            // Randomizar orden de preguntas
            questionsData.sort(() => Math.random() - 0.5);
            
            gameState.score = 0;
            gameState.currentQuestionIndex = 0;
            updateScoreDisplay();
            
            renderVirtualKeyboard();
            loadQuestion();
        }

        function loadQuestion() {
            gameState.status = 'playing';
            gameState.hintsUsed = 0;
            gameState.typedLetters = "";
            gameState.timerSeconds = 0;
            
            const q = questionsData[gameState.currentQuestionIndex];
            
            document.getElementById('question-counter').textContent = `Pregunta ${gameState.currentQuestionIndex + 1} de 12`;
            document.getElementById('question-text').textContent = q.question;
            
            // Reset Hint Button
            const hintBtn = document.getElementById('btn-hint');
            hintBtn.disabled = false;
            hintBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('hints-left').textContent = '3';
            
            // Clear hints container
            const hintsContainer = document.getElementById('hints-container');
            hintsContainer.innerHTML = '';
            hintsContainer.classList.add('hidden');

            renderWordBoxes();
            startTimer();
            showScreen('game');
        }

        function renderWordBoxes() {
            const container = document.getElementById('word-container');
            container.innerHTML = '';
            
            const answer = questionsData[gameState.currentQuestionIndex].answer;
            const typed = gameState.typedLetters;
            
            for (let i = 0; i < answer.length; i++) {
                const box = document.createElement('div');
                box.className = `w-12 h-12 sm:w-16 sm:h-16 flex items-center justify-center text-2xl sm:text-3xl font-bold border-2 rounded-xl uppercase transition-colors duration-200`;
                
                if (i < typed.length) {
                    box.textContent = typed[i];
                    box.classList.add('box-correct', 'animate-pop');
                } else {
                    box.textContent = "";
                    box.classList.add('bg-gray-50', 'border-gray-300', 'text-gray-800');
                    // Resaltar la caja actual
                    if (i === typed.length && gameState.status === 'playing') {
                        box.classList.add('box-active');
                        box.classList.remove('border-gray-300');
                    }
                }
                
                box.id = `box-${i}`;
                container.appendChild(box);
            }
        }

        function handleLetterInput(letter) {
            const answer = questionsData[gameState.currentQuestionIndex].answer;
            const currentIndex = gameState.typedLetters.length;
            
            if (currentIndex >= answer.length) return;

            const expectedLetter = answer[currentIndex];

            if (letter === expectedLetter) {
                // Correcto
                gameState.typedLetters += letter;
                renderWordBoxes();
                
                if (gameState.typedLetters.length === answer.length) {
                    handleWin();
                }
            } else {
                // Incorrecto
                const currentBox = document.getElementById(`box-${currentIndex}`);
                currentBox.classList.add('box-wrong', 'animate-shake');
                
                // Remover clases de error después de la animación
                setTimeout(() => {
                    currentBox.classList.remove('box-wrong', 'animate-shake');
                }, 300);

                // Regla especial: "Al agotar 3 pistas sin acertar: se revela la respuesta"
                if (gameState.hintsUsed >= 3) {
                    setTimeout(() => {
                        handleFail();
                    }, 300);
                }
            }
        }

        function useHint() {
            if (gameState.hintsUsed >= 3 || gameState.status !== 'playing') return;

            const q = questionsData[gameState.currentQuestionIndex];
            const answer = q.answer;
            const currentIndex = gameState.typedLetters.length;
            
            // Agregar la letra actual automáticamente
            gameState.typedLetters += answer[currentIndex];
            
            // Mostrar texto de la pista
            const hintsContainer = document.getElementById('hints-container');
            hintsContainer.classList.remove('hidden');
            
            const hintEl = document.createElement('div');
            hintEl.className = 'bg-yellow-50 border-l-4 border-yellow-400 p-3 text-left text-sm sm:text-base text-yellow-800 rounded shadow-sm animate-pop';
            hintEl.innerHTML = `<strong>Pista ${gameState.hintsUsed + 1}:</strong> ${q.hints[gameState.hintsUsed]}`;
            hintsContainer.appendChild(hintEl);

            gameState.hintsUsed++;
            document.getElementById('hints-left').textContent = 3 - gameState.hintsUsed;

            // Deshabilitar botón si se usaron 3
            if (gameState.hintsUsed >= 3) {
                const hintBtn = document.getElementById('btn-hint');
                hintBtn.disabled = true;
                hintBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            renderWordBoxes();

            // Verificar si con la pista completó la palabra
            if (gameState.typedLetters.length === answer.length) {
                handleWin();
            }
        }

        function handleWin() {
            stopTimer();
            gameState.status = 'explanation';
            
            // Calcular puntos: 100 - (20 * pistas)
            const pointsEarned = 100 - (gameState.hintsUsed * 20);
            gameState.score += pointsEarned;
            updateScoreDisplay();

            showExplanationScreen(true, pointsEarned);
        }

        function handleFail() {
            stopTimer();
            gameState.status = 'explanation';
            
            // Rellenar visualmente con rojo
            const answer = questionsData[gameState.currentQuestionIndex].answer;
            gameState.typedLetters = answer; // Autocompletar para la vista
            
            // Mostrar todas las cajas como rojas
            const container = document.getElementById('word-container');
            container.innerHTML = '';
            for (let i = 0; i < answer.length; i++) {
                const box = document.createElement('div');
                box.className = `w-12 h-12 sm:w-16 sm:h-16 flex items-center justify-center text-2xl sm:text-3xl font-bold border-2 rounded-xl uppercase bg-red-500 text-white border-red-600 animate-shake`;
                box.textContent = answer[i];
                container.appendChild(box);
            }

            setTimeout(() => {
                showExplanationScreen(false, 0);
            }, 1000);
        }

        function showExplanationScreen(isSuccess, points) {
            const q = questionsData[gameState.currentQuestionIndex];
            
            const iconContainer = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const pointsAwarded = document.getElementById('points-awarded');
            const explanation = document.getElementById('explanation-text');
            const btnNext = document.getElementById('btn-next');

            explanation.textContent = q.explanation;

            if (isSuccess) {
                iconContainer.className = "w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center bg-green-100 animate-pop";
                iconContainer.innerHTML = `<svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>`;
                title.textContent = "¡Correcto!";
                title.className = "text-3xl font-bold mb-2 text-green-700";
                pointsAwarded.textContent = `+${points} Puntos`;
                pointsAwarded.className = "text-lg font-semibold text-green-600 mb-6";
            } else {
                iconContainer.className = "w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center bg-red-100 animate-pop";
                iconContainer.innerHTML = `<svg class="w-12 h-12 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                title.textContent = "¡Respuesta Revelada!";
                title.className = "text-3xl font-bold mb-2 text-red-700";
                pointsAwarded.textContent = `0 Puntos (Límite de pistas superado)`;
                pointsAwarded.className = "text-lg font-semibold text-red-600 mb-6";
            }

            if (gameState.currentQuestionIndex === questionsData.length - 1) {
                btnNext.textContent = "Ver Resultados Finales";
            } else {
                btnNext.textContent = "Siguiente Pregunta";
            }

            showScreen('explanation');
        }

        function nextQuestion() {
            if (gameState.currentQuestionIndex < questionsData.length - 1) {
                gameState.currentQuestionIndex++;
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            gameState.status = 'end';
            
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('final-message').textContent = `¡Gran esfuerzo, ${gameState.playerName}! Aquí está tu resultado:`;
            
            // Calcular estrellas (Max 1200 puntos)
            const maxScore = 1200;
            const percentage = gameState.score / maxScore;
            let stars = 1;
            
            if (percentage >= 0.9) stars = 5;
            else if (percentage >= 0.7) stars = 4;
            else if (percentage >= 0.5) stars = 3;
            else if (percentage >= 0.3) stars = 2;
            
            const starsContainer = document.getElementById('stars-container');
            starsContainer.innerHTML = '';
            for(let i = 1; i <= 5; i++) {
                const starSpan = document.createElement('span');
                starSpan.textContent = '★';
                if (i <= stars) {
                    starSpan.classList.add('text-yellow-400');
                    starSpan.classList.add('animate-pop');
                    starSpan.style.animationDelay = `${i * 0.1}s`;
                } else {
                    starSpan.classList.add('text-gray-300');
                }
                starsContainer.appendChild(starSpan);
            }

            showScreen('end');
        }

        function resetGame() {
            gameState = {
                playerName: "",
                score: 0,
                currentQuestionIndex: 0,
                hintsUsed: 0,
                typedLetters: "",
                timerSeconds: 0,
                timerInterval: null,
                status: 'start'
            };
            document.getElementById('player-name').value = '';
            showScreen('start');
        }

        // --- SISTEMA DE TIEMPO Y PUNTAJE ---
        function startTimer() {
            clearInterval(gameState.timerInterval);
            updateTimerDisplay();
            gameState.timerInterval = setInterval(() => {
                gameState.timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(gameState.timerInterval);
        }

        function updateTimerDisplay() {
            const m = Math.floor(gameState.timerSeconds / 60).toString().padStart(2, '0');
            const s = (gameState.timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').textContent = `${m}:${s}`;
        }

        function updateScoreDisplay() {
            // Animar el cambio de puntaje
            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.textContent = gameState.score;
            scoreDisplay.classList.add('animate-pop');
            setTimeout(() => scoreDisplay.classList.remove('animate-pop'), 200);
        }

    </script>
</body>
</html>
